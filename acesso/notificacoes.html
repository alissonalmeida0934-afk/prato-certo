<!DOCTYPE html>
<html lang="pt-PT">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  var _s=window.supabase.createClient('https://achtuwinkhhqiovzpoth.supabase.co','sb_publishable_bu-Kz9vcPInHCxwUOqy7yw_8e_7GXgy');
  window._sb=_s;
  var hasSb=Object.keys(localStorage).some(function(k){return k.startsWith('sb-')&&k.includes('auth');});
  if(!hasSb)document.documentElement.style.visibility='hidden';
  function chk(){_s.auth.getSession().then(function(r){if(!r.data.session){window.location.replace('/login.html');}else{document.documentElement.style.visibility='';}});}
  chk();
  window.addEventListener('pageshow',function(e){if(e.persisted)chk();});
})();
</script>
<script>if(localStorage.getItem('pc-theme')==='light')document.documentElement.classList.add('light');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Notificações — Prato Certo</title>
<link rel="icon" href="/img/logo-prato-certo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#E46C44;--primary-vibrant:#FD860E;--background:#0c0c0c;--surface:#161616;--surface2:#1e1e1e;--text:#F0EDE8;--muted:#8A8278;--line:rgba(255,255,255,.08)}
html.light{--background:#F7F5ED;--surface:#FAF9F5;--surface2:#F0EBE0;--text:#231E1A;--muted:#7A726A;--line:rgba(0,0,0,.09)}
body{font-family:'Rubik',sans-serif;background:var(--background);color:var(--text);min-height:100vh}
header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--line);padding:0 18px;height:54px;display:flex;align-items:center;justify-content:space-between}
.hback{display:flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;font-weight:600;font-size:.9rem}
.hback svg{width:20px;height:20px;stroke:var(--primary);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.btn-marcar{background:var(--primary);color:#fff;border:none;border-radius:99px;padding:8px 18px;font-family:inherit;font-weight:600;font-size:.8rem;cursor:pointer;transition:.15s}
.btn-marcar:hover{background:var(--primary-vibrant)}
main{max-width:640px;margin:0 auto;padding:24px 16px}
.page-label{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--primary);font-weight:700;margin-bottom:6px}
h1{font-size:1.6rem;font-weight:800;margin-bottom:24px}
.empty-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:56px 24px;text-align:center}
.empty-card svg{width:44px;height:44px;stroke:var(--muted);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:16px}
.empty-card h3{font-size:1rem;font-weight:700;margin-bottom:8px}
.empty-card p{font-size:.82rem;color:var(--muted);line-height:1.6;max-width:360px;margin:0 auto}
</style>
</head>
<body>
<header>
  <a class="hback" href="index.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Voltar
  </a>
  <button class="btn-marcar">Marcar todos como lidos</button>
</header>
<main>
  <div class="page-label">Prato Certo</div>
  <h1>Notificações</h1>
  <div class="empty-card">
    <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    <h3>Nenhuma notificação nova.</h3>
    <p>Acompanha aqui as novidades, novos módulos desbloqueados e atualizações da plataforma.</p>
  </div>
</main>
</body>
</html>
