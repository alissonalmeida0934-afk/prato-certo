<!DOCTYPE html>
<html lang="pt-PT">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  var _s=window.supabase.createClient('https://achtuwinkhhqiovzpoth.supabase.co','sb_publishable_bu-Kz9vcPInHCxwUOqy7yw_8e_7GXgy');
  window._sb=_s;
  var L='/login.html';
  document.documentElement.style.visibility='hidden';
  _s.auth.getSession().then(function(r){
    if(!r.data.session){window.location.replace(L);return;}
    if((r.data.session.user.email||'').toLowerCase()!=='alissonalmeida0934@gmail.com'){
      window.location.replace('/acesso/');return;
    }
    document.documentElement.style.visibility='';
  });

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Prato Certo</title>
<link rel="icon" href="../img/logo-prato-certo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Rubik',sans-serif;background:#0c0c0c;color:#F0EDE8;padding:24px 16px 60px}
h1{font-size:1.3rem;margin-bottom:4px}
.sub{color:#8A8078;font-size:.85rem;margin-bottom:20px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.stat{background:#161616;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 16px;min-width:120px}
.stat .n{font-size:1.4rem;font-weight:800;color:#E46C44}
.stat .l{font-size:.72rem;color:#8A8078;text-transform:uppercase;letter-spacing:.05em}
.search{width:100%;max-width:320px;background:#1e1e1e;border:1px solid rgba(255,255,255,.1);border-radius:10px;
  color:#F0EDE8;padding:10px 14px;margin-bottom:16px;font-family:inherit;outline:none}
.search:focus{border-color:#E46C44}
.tbl-wrap{overflow-x:auto;border:1px solid rgba(255,255,255,.08);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.82rem;white-space:nowrap}
th{background:#161616;color:#8A8078;text-align:left;padding:10px 12px;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
td{padding:10px 12px;border-top:1px solid rgba(255,255,255,.06)}
tr:hover td{background:rgba(255,255,255,.03)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:700}
.badge.premium{background:rgba(245,196,0,.15);color:#F5C400}
.badge.base{background:rgba(255,255,255,.08);color:#8A8078}
.muted{color:#8A8078}
.loading{padding:40px;text-align:center;color:#8A8078}
.err{padding:40px;text-align:center;color:#ff6b6b}
</style>
</head>
<body>

<h1>Painel Admin — Área de Membros</h1>
<p class="sub">Actividade dos utilizadores (login, receitas abertas) · <a href="dashboard.html" style="color:#E46C44;text-decoration:none">Ver dashboard financeiro →</a></p>

<div class="stats" id="stats"></div>
<input class="search" id="search" placeholder="Pesquisar por email...">

<div class="tbl-wrap">
  <table>
    <thead>
      <tr>
        <th>Email</th><th>Plano</th><th>Criado em</th><th>Último login</th>
        <th>Dias logados</th><th>Receitas abertas</th><th>Última receita</th>
      </tr>
    </thead>
    <tbody id="tbody"><tr><td colspan="7" class="loading">A carregar...</td></tr></tbody>
  </table>
</div>

<script>
var WORKER_URL = 'https://hotmart-webhook.alissonalmeida0934.workers.dev/admin/users';
var allRows = [];

function fmtDate(iso){
  if(!iso) return '<span class="muted">nunca</span>';
  var d = new Date(iso);
  return d.toLocaleDateString('pt-PT') + ' ' + d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
}

function renderRows(rows){
  var tbody = document.getElementById('tbody');
  if(!rows.length){ tbody.innerHTML = '<tr><td colspan="7" class="loading">Nenhum utilizador encontrado.</td></tr>'; return; }
  tbody.innerHTML = rows.map(function(u){
    var receita = u.ultima_receita ? (u.ultima_receita.receita + ' <span class="muted">(' + u.ultima_receita.categoria + ')</span>') : '<span class="muted">—</span>';
    return '<tr>' +
      '<td>' + u.email + '</td>' +
      '<td><span class="badge ' + u.plano + '">' + u.plano + '</span></td>' +
      '<td>' + fmtDate(u.criado_em) + '</td>' +
      '<td>' + fmtDate(u.ultimo_login) + '</td>' +
      '<td>' + u.dias_logados + '</td>' +
      '<td>' + u.receitas_abertas + '</td>' +
      '<td>' + receita + '</td>' +
    '</tr>';
  }).join('');
}

function renderStats(rows){
  var total = rows.length;
  var premium = rows.filter(function(u){return u.plano==='premium'}).length;
  var ativos7d = rows.filter(function(u){
    if(!u.ultimo_login) return false;
    return (Date.now() - new Date(u.ultimo_login).getTime()) < 7*24*60*60*1000;
  }).length;
  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="n">' + total + '</div><div class="l">Utilizadores</div></div>' +
    '<div class="stat"><div class="n">' + premium + '</div><div class="l">Premium</div></div>' +
    '<div class="stat"><div class="n">' + ativos7d + '</div><div class="l">Activos 7 dias</div></div>';
}

async function load(){
  try{
    var session = (await window._sb.auth.getSession()).data.session;
    var res = await fetch(WORKER_URL, { headers: { 'Authorization': 'Bearer ' + session.access_token } });
    if(!res.ok){
      document.getElementById('tbody').innerHTML = '<tr><td colspan="7" class="err">Erro ao carregar (' + res.status + ')</td></tr>';
      return;
    }
    allRows = await res.json();
    renderStats(allRows);
    renderRows(allRows);
  }catch(e){
    document.getElementById('tbody').innerHTML = '<tr><td colspan="7" class="err">Erro: ' + e.message + '</td></tr>';
  }
}

document.getElementById('search').addEventListener('input', function(e){
  var q = e.target.value.trim().toLowerCase();
  renderRows(allRows.filter(function(u){ return u.email.toLowerCase().indexOf(q) !== -1; }));
});

load();
</script>
</body>
</html>
